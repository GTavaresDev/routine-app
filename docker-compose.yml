services:
  postgres:
    image: postgres:16-alpine
    container_name: routine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: routine_db
      POSTGRES_USER: routine_user
      POSTGRES_PASSWORD: routine_pass
    ports:
      - "5434:5432"
    volumes:
      - routine_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routine_user -d routine_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  routine_postgres_data:
